name = "joewline-intake-bot"
main = "src/index.js"
compatibility_date = "2024-09-01"

# Дає доступ до env.AI (Whisper для розшифровки голосу) безкоштовно
# в межах ліміту Workers AI free tier.
[ai]
binding = "AI"

# Не секретні налаштування. Секрети (токени) задаються окремо командою
# `wrangler secret put <NAME>` — вони НЕ повинні лежати в цьому файлі.
[vars]
GITHUB_OWNER = "floksipet"
GITHUB_REPO = "joewline-blog"
GITHUB_BRANCH = "main"
CONTENT_PATH = "site/src/content/cases"
SITE_URL = "https://floksipet.github.io/joewline-blog/"

# Chat ID групи/каналу, куди бот дублює анонс кожного збереженого запису.
# Порожнє значення — анонс просто вимкнений, нічого не ламається.
#
# Як заповнити:
#   1. Створи групу або канал у Telegram.
#   2. Додай туди цього бота адміністратором (каналу — обов'язково адміном,
#      групі досить бути учасником, але для каналу інакше він не зможе постити).
#   3. Дізнайся chat_id: напиши будь-що в групі, тоді відкрий у браузері
#      https://api.telegram.org/bot<TOKEN>/getUpdates і знайди "chat":{"id": ...}
#      (для груп/каналів це від'ємне число, напр. -1001234567890).
#   4. Впиши це число нижче в лапках і виконай `cd bot && npx wrangler deploy`.
ANNOUNCE_CHAT_ID = "-1004424065462"

[[kv_namespaces]]
binding = "joewline_bot_drafts"
id = "0c3acf3fc82e4fef80c56064a2301e60"
