<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C87F4A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#C87F4A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="240" height="240" rx="44" fill="#1C2126"/>

  <!-- left pins -->
  <rect x="48" y="98" width="18" height="10" rx="2" fill="#C87F4A"/>
  <rect x="48" y="122" width="18" height="10" rx="2" fill="#C87F4A"/>
  <rect x="48" y="146" width="18" height="10" rx="2" fill="#C87F4A"/>

  <!-- right pins -->
  <rect x="174" y="98" width="18" height="10" rx="2" fill="#C87F4A"/>
  <rect x="174" y="146" width="18" height="10" rx="2" fill="#C87F4A"/>

  <!-- chip body -->
  <rect x="64" y="78" width="112" height="88" rx="10" fill="#242C32" stroke="#EDE6DA" stroke-width="3.5"/>

  <!-- pin-1 indicator -->
  <circle cx="79" cy="93" r="4.5" fill="#C87F4A"/>

  <!-- wordmark -->
  <text x="120" y="132" text-anchor="middle" font-family="'JetBrains Mono','Courier New',ui-monospace,monospace" font-weight="700" font-size="42" letter-spacing="1" fill="#EDE6DA">JWL</text>

  <!-- signature: outgoing trace + broadcast pulse -->
  <path d="M192 103 L206 103 L206 84" fill="none" stroke="#C87F4A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="206" cy="80" r="16" fill="url(#pulseGlow)"/>
  <circle cx="206" cy="80" r="9" fill="none" stroke="#C87F4A" stroke-width="2" opacity="0.55"/>
  <circle cx="206" cy="80" r="4" fill="#C87F4A"/>
</svg>
